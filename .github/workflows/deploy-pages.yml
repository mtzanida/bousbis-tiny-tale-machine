name: Deploy frontend to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject LAMBDA_URL into config.js
        env:
          LAMBDA_URL: ${{ secrets.LAMBDA_URL }}
        run: |
          if [ -z "$LAMBDA_URL" ]; then
            echo "❌ LAMBDA_URL secret is not set in repository secrets (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          cat > frontend/config.js <<EOF
          // Auto-generated by GitHub Actions — do not edit manually.
          // Set LAMBDA_URL in repository secrets (Settings → Secrets and variables → Actions).
          window.APP_CONFIG = {
            LAMBDA_URL: "$LAMBDA_URL"
          };
          EOF
          echo "✅ config.js written"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
